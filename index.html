<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="訪問ログイン試験">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<title>訪問アプリ ログイン試験</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1f2933; --sub:#5f6b7a; --main:#0f766e; --ok:#15803d; --ng:#c62828; --line:#e3e6ea; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
         padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font-size:20px; margin:0 0 4px; }
  .ver { color:var(--sub); font-size:13px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .row:last-child { border-bottom:0; }
  .row .k { color:var(--sub); flex-shrink:0; }
  .row .v { text-align:right; word-break:break-all; }
  .state { font-size:22px; font-weight:700; margin:4px 0 8px; }
  .state.ok { color:var(--ok); } .state.ng { color:var(--ng); }
  .uid { font-family:ui-monospace, Menlo, monospace; font-size:16px; background:#f0fdfa; border:1px solid #99f6e4; border-radius:10px; padding:12px; word-break:break-all; margin:8px 0; }
  button { width:100%; font-size:17px; font-weight:600; padding:14px; border-radius:12px; border:0; margin-top:10px; }
  .primary { background:var(--main); color:#fff; }
  .outline { background:#fff; color:var(--main); border:1.5px solid var(--main); }
  .err { color:var(--ng); font-size:14px; white-space:pre-wrap; word-break:break-all; }
  .note { color:var(--sub); font-size:13px; line-height:1.6; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<h1>訪問アプリ ログイン試験</h1>
<div class="ver">試験ページ v1（患者データは入っていません）</div>

<div class="card">
  <div class="row"><span class="k">開き方</span><span class="v" id="mode"></span></div>
  <div class="row"><span class="k">このページを開いた時刻</span><span class="v" id="openedAt"></span></div>
</div>

<div class="card">
  <div class="state" id="state">確認中…</div>
  <div id="signedIn" hidden>
    <div class="note">あなたのUID（Firestoreのルールに使います）</div>
    <div class="uid" id="uid"></div>
    <button class="outline" id="copyBtn">UIDをコピー</button>
    <div class="row"><span class="k">アカウント</span><span class="v" id="email"></span></div>
    <div class="row"><span class="k">最後にログインした時刻</span><span class="v" id="lastSignIn"></span></div>
    <div class="row"><span class="k">ログインを保った日数</span><span class="v" id="keptDays"></span></div>
    <button class="outline" id="signOutBtn">ログアウト</button>
  </div>
  <div id="signedOut" hidden>
    <button class="primary" id="signInBtn">Googleでログイン</button>
  </div>
  <div class="err" id="err"></div>
</div>

<div class="note">
  確かめること：① Safariでログインできる ② ホーム画面に追加して、そこから開いてもログインできる ③ 次の日に開いても「ログイン中」のまま
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

// Firebaseの設定（秘密の値ではありません。ログインの入口の名前です）
const firebaseConfig = {
  apiKey: "AIzaSyBpe9xnDzVZtmE-PxL9rcixZoUFGGYO9Bs",
  authDomain: "houmon-app-abc54.firebaseapp.com",
  projectId: "houmon-app-abc54",
  appId: "1:239454118010:web:2f86a624e03cccb5039bc3",
};

const $ = id => document.getElementById(id);
const fmt = d => d ? new Date(d).toLocaleString('ja-JP', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';
const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
$('mode').textContent = standalone ? 'ホーム画面から' : 'ブラウザ（Safariなど）';
$('openedAt').textContent = fmt(Date.now());

const showErr = (msg, e) => { $('err').textContent = msg + (e ? `\n${e.code || ''} ${e.message || e}` : ''); };

if (!firebaseConfig.apiKey) {
  $('state').textContent = 'まだ設定が入っていません';
  $('state').className = 'state ng';
} else {
  const auth = getAuth(initializeApp(firebaseConfig));
  onAuthStateChanged(auth, user => {
    $('signedIn').hidden = !user;
    $('signedOut').hidden = !!user;
    $('state').textContent = user ? '✓ ログイン中' : 'ログインしていません';
    $('state').className = 'state ' + (user ? 'ok' : 'ng');
    if (!user) return;
    $('uid').textContent = user.uid;
    $('email').textContent = user.email || '—';
    const last = user.metadata.lastSignInTime;
    $('lastSignIn').textContent = fmt(last);
    $('keptDays').textContent = last ? `${Math.floor((Date.now() - new Date(last)) / 86400000)}日` : '—';
  });
  $('signInBtn').onclick = async () => {
    $('err').textContent = '';
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (e) { showErr('ログインできませんでした。この画面を写真に撮って送ってください。', e); }
  };
  $('signOutBtn').onclick = async () => {
    if (!confirm('ログアウトしますか？（試験をやり直すときだけ使います）')) return;
    try { await signOut(auth); } catch (e) { showErr('ログアウトできませんでした。', e); }
  };
  $('copyBtn').onclick = async () => {
    try { await navigator.clipboard.writeText($('uid').textContent); $('copyBtn').textContent = 'コピーしました ✓'; }
    catch (e) { showErr('コピーできませんでした。UIDを長押しして選んでください。', e); }
  };
}
</script>
</body>
</html>
